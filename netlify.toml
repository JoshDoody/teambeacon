# Publish only site/ — the web root is an allowlist by construction. Docs,
# tests, scripts and package files live outside it and so cannot be served.
# Functions are bundled from netlify/functions and are not part of the root.
[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

# Ensure /app redirects to /app/ (trailing slash) so index.html is served
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301
